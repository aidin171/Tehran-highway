<script type="module">
const $ = id => document.getElementById(id);
const fa = n => String(Math.round(n)).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

try { await Promise.race([document.fonts.load('700 48px Vazirmatn'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
try {
  const [THREE, ec, rp, ub, sp, op, bu] = await Promise.all([
    import('three'), import('three/addons/postprocessing/EffectComposer.js'), import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'), import('three/addons/postprocessing/ShaderPass.js'),
    import('three/addons/postprocessing/OutputPass.js'), import('three/addons/utils/BufferGeometryUtils.js'),
  ]);
  // real car models (FBX); if anything fails to load the game falls back to the built-in procedural cars
  const models = {};
  try {
    const { FBXLoader } = await import('three/addons/loaders/FBXLoader.js');
    const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
    const mgr = new THREE.LoadingManager(); mgr.setURLModifier(u => /\.(png|jpe?g|tga|bmp|dds)(\?|$)/i.test(u) ? BLANK : u);
    const list = ['132', 'nasim', 'l90', 'p206', 'p405', 'zamyad']; let done = 0;
    await Promise.allSettled(list.map(async k => { try { models[k] = await new FBXLoader(mgr).loadAsync('models/' + k + '.fbx'); } catch (e) { console.warn('model', k, e); } done++; $('msg').textContent = 'در حال بارگذاری ماشین‌ها… ' + fa(done) + ' از ' + fa(list.length); }));
  } catch (e) { console.warn('FBX loader unavailable', e); }
  init(THREE, { EffectComposer: ec.EffectComposer, RenderPass: rp.RenderPass, UnrealBloomPass: ub.UnrealBloomPass, ShaderPass: sp.ShaderPass, OutputPass: op.OutputPass, mergeGeometries: bu.mergeGeometries, models });
} catch (err) {
  console.error(err);
  $('msg').textContent = 'بارگذاری بازی ناموفق بود. اینترنت را بررسی کن و صفحه را دوباره باز کن (مرورگر باید از WebGL پشتیبانی کند).';
  $('btn').textContent = 'بارگذاری مجدد'; $('btn').disabled = false; $('btn').onclick = () => location.reload();
}

function init(THREE, P) {
  const Q = new URLSearchParams(location.search);
  const isMobile = Q.has('mobile') || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || matchMedia('(pointer:coarse)').matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a), irand = (a, b) => Math.floor(rand(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
  const damp = (a, b, l, dt) => a + (b - a) * (1 - Math.exp(-l * dt));
  const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  const BEST_KEY = 'tehran-hwy-best', MUTE_KEY = 'tehran-hwy-mute', CAR_KEY = 'tehran-hwy-car';
  let best = 0; try { best = +localStorage.getItem(BEST_KEY) || 0; } catch (e) {}
  $('best').textContent = fa(best);

  // ---------- renderer / scene / camera ----------
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  let pr = Math.min(devicePixelRatio || 1, isMobile ? 1.5 : 2); renderer.setPixelRatio(pr);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
  const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xe39464, 70, isMobile ? 480 : 700);
  const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, .1, 1800);
  scene.add(camera);

  // ---------- procedural texture toolkit ----------
  const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
  function pnoise(x, y, p) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const x0 = ((xi % p) + p) % p, x1 = (x0 + 1) % p, y0 = ((yi % p) + p) % p, y1 = (y0 + 1) % p;
    const a = hash2(x0, y0), b = hash2(x1, y0), c = hash2(x0, y1), d = hash2(x1, y1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function pfbm(u, v, per, oct) { let s = 0, a = .5, f = 1, t = 0; for (let i = 0; i < oct; i++) { s += a * pnoise(u * per * f, v * per * f, per * f); t += a; f *= 2; a *= .5; } return s / t; }
  const newCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  function tex(c, repeat, srgb = true) {
    const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = maxAniso; if (repeat) t.repeat.set(repeat[0], repeat[1]); return t;
  }
  function noiseCanvas(w, h, base, per, contrast) {
    const c = newCanvas(w, h), g = c.getContext('2d'), img = g.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const u = x / w, v = y / h, n = pfbm(u, v, per, 4), grain = (hash2(x * .7, y * 1.3) - .5) * .2;
      const k = .5 + clamp(.5 + (n - .5) * 1.4 * contrast + grain, 0, 1) * .75, i = (y * w + x) * 4;
      img.data[i] = base[0] * k; img.data[i + 1] = base[1] * k; img.data[i + 2] = base[2] * k; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0); return c;
  }
  function normalCanvas(size, per, strength) {
    const h = new Float32Array(size * size);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) h[y * size + x] = pfbm(x / size, y / size, per, 3);
    const c = newCanvas(size, size), g = c.getContext('2d'), img = g.createImageData(size, size);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const dx = h[y * size + (x + 1) % size] - h[y * size + (x - 1 + size) % size], dy = h[((y + 1) % size) * size + x] - h[((y - 1 + size) % size) * size + x];
      let nx = -dx * strength, ny = -dy * strength, nz = 1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l; const i = (y * size + x) * 4;
      img.data[i] = (nx * .5 + .5) * 255; img.data[i + 1] = (ny * .5 + .5) * 255; img.data[i + 2] = (nz * .5 + .5) * 255; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0); return c;
  }
  function glowCanvas(kind) {
    const w = kind === 'beam' ? 64 : 64, h = kind === 'beam' ? 256 : 64, c = newCanvas(w, h), g = c.getContext('2d');
    if (kind === 'beam') { g.translate(w / 2, h); g.scale(1, 3.6); const gr = g.createRadialGradient(0, 0, 0, 0, 0, w / 2); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.5, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(-w / 2, -h, w, h); }
    else { const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.4, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }
    return c;
  }
  const spriteT = tex(glowCanvas('dot'), null), beamT = tex(glowCanvas('beam'), null);
  const faText = (g, text, x, y, size, color, weight = 800, align = 'center') => {
    g.font = weight + ' ' + size + 'px Vazirmatn, Tahoma, "Segoe UI", sans-serif'; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle'; g.direction = 'rtl'; g.fillText(text, x, y);
  };

  // ======================================================================
  // sky, sun, moon, 5-phase day cycle (sunset -> dusk -> night -> dawn -> day)
  // ======================================================================
  const skyU = {
    top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, hor: { value: new THREE.Color() },
    sunDir: { value: new THREE.Vector3(.25, .09, -1).normalize() }, sunCol: { value: new THREE.Color() },
    moonDir: { value: new THREE.Vector3(-.35, .5, -1).normalize() }, moonAmt: { value: 0 },
    stars: { value: 0 }, cloudCol: { value: new THREE.Color() }, cloudAmt: { value: .7 }, time: { value: 0 }
  };
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `
      uniform vec3 top; uniform vec3 mid; uniform vec3 hor; uniform vec3 sunDir; uniform vec3 sunCol; uniform vec3 moonDir;
      uniform float moonAmt; uniform float stars; uniform vec3 cloudCol; uniform float cloudAmt; uniform float time; varying vec3 vP;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }
      float fbm(vec2 p){ float s = 0.0; float a = 0.5; for(int i = 0; i < 5; i++){ s += a * noise(p); p *= 2.03; a *= 0.5; } return s; }
      void main(){
        vec3 d = normalize(vP); float h = d.y;
        vec3 c = mix(hor, mid, smoothstep(0.0, 0.3, h)); c = mix(c, top, smoothstep(0.2, 0.9, h)); c = mix(c, hor * 0.55, 1.0 - smoothstep(-0.25, 0.0, h));
        float sd = max(dot(d, sunDir), 0.0);
        c += sunCol * (pow(sd, 6.0) * 0.45 + pow(sd, 60.0) * 0.8 + pow(sd, 700.0) * 3.0);
        if (stars > 0.01 && h > 0.0) {
          vec2 uv = vec2(atan(d.z, d.x) * 70.0, asin(clamp(d.y, -1.0, 1.0)) * 70.0); vec2 cell = floor(uv); float r = hash(cell);
          float st = step(0.985, r) * smoothstep(0.38, 0.0, length(fract(uv) - 0.5)); st *= 0.6 + 0.4 * sin(time * 3.0 + r * 40.0);
          c += vec3(0.9, 0.95, 1.0) * st * stars * smoothstep(0.02, 0.25, h) * 1.6;
